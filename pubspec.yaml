name: entangl_app
description: Entangl - A modern social media platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  crop_your_image: ^2.0.0
  
  image_cropper: ^9.0.0

  # Supabase
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Image handling
  image_picker: ^1.1.2
  video_player: ^2.9.2
  cached_network_image: ^3.3.1

  # Storage & Prefs
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # UI Utilities
  timeago: ^3.6.1
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icon.png"

  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
